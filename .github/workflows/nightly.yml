name: Scheduled Nightly Maintenance
on:
  schedule:
    - cron: '0 4 * * *' # Every night at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-check:
    name: Nightly Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite & Ratchet Checks
        run: npm test

      - name: Build WebExtension XPI
        run: npm run build

      - name: AMO Compliance Verification
        run: npm run lint:addon

      - name: Check Outdated Packages
        id: outdated
        continue-on-error: true
        run: npm outdated || true

      - name: Security Vulnerability Scan
        continue-on-error: true
        run: npm audit --audit-level=high || true
