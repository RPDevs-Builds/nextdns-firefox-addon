name: Extension Pipeline
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Tests
        run: NODE_OPTIONS="--experimental-vm-modules" npm test

      - name: Build XPI
        run: npm run build

      - name: AMO Compliance Lint
        run: npm run lint:addon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dns-forge-xpi
          path: web-ext-artifacts/
          retention-days: 5

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Built Artifacts
        uses: actions/download-artifact@v8
        with:
          name: dns-forge-xpi
          path: release-artifacts/

      - name: Sign Extension with Mozilla (Unlisted)
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "Submitting to Mozilla for signing..."
            npm run sign || echo "Note: Signing completed or version already submitted."
            if [ -d "web-ext-artifacts" ]; then
              SIGNED_XPI=$(ls -t web-ext-artifacts/*.xpi 2>/dev/null | head -n 1)
              if [ -n "$SIGNED_XPI" ]; then
                echo "Found signed XPI: $SIGNED_XPI"
                for orig in release-artifacts/dns_forge-*.xpi; do
                  if [ -f "$orig" ]; then
                    echo "Replacing $orig with signed package $SIGNED_XPI"
                    cp -f "$SIGNED_XPI" "$orig"
                  fi
                done
                cp -f "$SIGNED_XPI" release-artifacts/ 2>/dev/null || true
              fi
            fi
          else
            echo "AMO credentials not configured. Proceeding with unsigned build."
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
