name: Extension Pipeline
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Tests
        run: NODE_OPTIONS="--experimental-vm-modules" npm test

      - name: Build XPI
        run: npm run build

      - name: AMO Compliance Lint
        run: npm run lint:addon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dns-forge-xpi
          path: web-ext-artifacts/
          retention-days: 5

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Built Artifacts
        uses: actions/download-artifact@v8
        with:
          name: dns-forge-xpi
          path: release-artifacts/

      - name: Sign Extension with Mozilla (Unlisted)
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "Submitting to Mozilla for signing..."
            npm run sign
            if [ -d "web-ext-artifacts" ]; then
              SIGNED_XPI=$(ls -t web-ext-artifacts/*.xpi 2>/dev/null | head -n 1)
              if [ -n "$SIGNED_XPI" ]; then
                echo "Found signed XPI: $SIGNED_XPI"
                VERSION=$(node -p "require('./package.json').version")
                rm -rf release-artifacts/*
                cp -f "$SIGNED_XPI" "release-artifacts/dns_forge-${VERSION}.xpi"
                echo "Release artifact prepared: release-artifacts/dns_forge-${VERSION}.xpi"
              else
                echo "❌ No signed XPI found in web-ext-artifacts"
                exit 1
              fi
            else
              echo "❌ web-ext-artifacts directory not found"
              exit 1
            fi
          else
            echo "AMO credentials not configured. Proceeding with unsigned build."
          fi

      - name: Commit and Push Signed Checksum to updates.json
        run: |
          if git status --porcelain | grep -q "updates.json"; then
            echo "Committing signed sha256 checksum in updates.json..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add updates.json
            git commit -m "chore(updates): record signed sha256 checksum [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
